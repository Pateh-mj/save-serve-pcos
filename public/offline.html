<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#16a34a" />
    <title>Offline · SaveServe</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        background: #f9fafb;
        color: #111827;
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      main {
        width: 100%;
        max-width: 420px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        padding: 28px 24px;
        text-align: center;
      }
      .badge { width: 56px; height: 56px; margin: 0 auto 16px; border-radius: 14px; background: #16a34a; display: grid; place-items: center; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.55; color: #4b5563; margin: 0 0 16px; }
      .ussd { font-size: 32px; font-weight: 800; color: #16a34a; letter-spacing: 1px; margin: 4px 0 4px; }
      .note { font-size: 12px; color: #6b7280; }
      .emergency { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; border-radius: 10px; padding: 10px 12px; font-size: 13px; margin: 16px 0; }
      button { appearance: none; border: 0; border-radius: 10px; background: #16a34a; color: #fff; font-weight: 600; font-size: 14px; padding: 10px 18px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <div class="badge" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="#fff"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z" /></svg>
      </div>
      <h1>You're offline</h1>
      <p>No internet connection right now. SaveServe still works on any phone, with no data needed. Dial:</p>
      <div class="ussd">*384#</div>
      <p class="note">Book a visit, check appointments, see your records and pay bills by USSD.</p>
      <div class="emergency"><strong>Emergency?</strong> Call 991 or go to the nearest health facility.</div>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
